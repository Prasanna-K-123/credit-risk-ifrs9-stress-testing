name: Frozen FDIC temporal bank-failure research
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  temporal-research:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-fdic-temporal.txt
      - run: python -m pip install -r requirements-fdic-temporal.txt
      - run: python -m pytest -q
      - name: Replay registered pinned temporal study
        if: ${{ hashFiles('reference/fdic_temporal/summary.json') != '' }}
        run: python benchmark_fdic_temporal.py --verify
      - uses: actions/upload-artifact@v4
        with:
          name: fdic-temporal-research
          path: reference/fdic_temporal/
