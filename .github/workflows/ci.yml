name: Credit Risk Validation Pipeline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Audit the committed holdout
        run: python audit_reference.py
      - name: Reproduce full UCI pipeline
        run: python run_pipeline.py
      - uses: actions/upload-artifact@v4
        with:
          name: credit-risk-reproduction
          path: |
            outputs/
            reports/generated/
